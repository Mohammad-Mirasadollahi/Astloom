[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astloom"
version = "0.1.2"
description = "Astloom control-plane CLI and shared packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.138.1",
  "uvicorn==0.49.0",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "neo4j==5.28.2",
  "tree-sitter==0.25.2",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-go==0.25.0",
  "tree-sitter-rust==0.24.0",
  "tree-sitter-java==0.23.5",
  "litellm>=1.40.0,<2",
  "tenacity>=8.2.0,<10",
  "rank-bm25==0.2.2",
  "PyYAML>=6.0.2,<7",
  "numpy>=1.26,<3",
  "cryptography==44.0.3",
  "argon2-cffi>=23.1.0,<26",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx2==2.5.0",
]
sdk = [
  # Marks the published SDK lane (astloom_sdk + adapter_harness); httpx is a core dep.
]
embeddings = [
  "sentence-transformers>=3.0.0,<6",
]
turbovec = [
  "turbovec>=0.1.0",
  "numpy>=1.26,<3",
]
graph-analytics = [
  "scikit-network>=0.32,<0.34",
  "scipy>=1.11,<2",
  "numpy>=1.26,<3",
]

[project.scripts]
astloom = "astloom_cli.main:main"
astloom-client = "astloom_client.main:main"

[tool.setuptools]
packages = [
  "astloom_auth",
  "astloom_cli",
  "astloom_client",
  "astloom_backup",
  "usage_profile",
  "outbox_relay",
  "llm_gateway",
  "context_compression",
  "repo_pack",
  "port_profile",
  "approval_modes",
  "weight_profiles",
  "vector_index",
  "architecture_governance",
  "agent_trust",
  "astloom_sdk",
  "adapter_harness",
  "adapter_harness.fixtures",
  "code_metadata",
  "common_context",
  "sdk",
  "sdk.generated",
  "sdk.python",
]

[tool.setuptools.package-dir]
"" = "backend/packages"
code_metadata = "backend/packages/code-metadata/code_metadata"
common_context = "backend/packages/common-context/common_context"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", "change-society"]
# So Test Explorer / bare `pytest` can import in-repo packages without exporting PYTHONPATH.
pythonpath = [
  "tests/support",
  "backend/services/code-graph-service/src",
  "backend/services/docs-sync-service/src",
  "backend/services/memory-service/src",
  "backend/services/rule-engine-service/src",
  "backend/services/core-data-service/src",
  "backend/services/identity-access-service/src",
  "backend/services/adapter-service/src",
  "backend/services/mcp-gateway-service/src",
  "backend/services/project-profile-service/src",
  "backend/services/audit-service/src",
  "backend/services/common-context-service/src",
  "backend/services/orchestration-service/src",
  "backend/services/reporting-service/src",
  "backend/packages",
  "backend/packages/code-metadata",
  "backend/packages/common-context",
]
markers = [
  "live: requires Compose Neo4j/Postgres (skips when unavailable)",
  "turbovec: requires optional turbovec package",
]
